name: Check Gonka chain load

on:
  schedule:
    # Every 5 minutes, offset from the other monitoring workflows.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

concurrency:
  group: gonka-chain-load-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-chain-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Gonka chain transaction load
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TELEGRAM_SECONDARY_CHAT_ID: ${{ secrets.TELEGRAM_SECONDARY_CHAT_ID }}
          CHAIN_LOAD_MODE: once
        run: python chain_load_watcher.py

      - name: Commit updated state
        if: always()
        run: bash scripts/commit_state.sh "Update chain load state [skip ci]" state/chain_load.json
